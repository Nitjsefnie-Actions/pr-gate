# pycodestyle configuration for the lint.yml gate. The gate exists for
# defects (indentation, blank-line, and statement rules); the two knobs
# below keep it that way, each with the measurement that justified it.
#
#   max-line-length — the tree's measured convention is 79 columns with
#   deliberate exceptions; at the default 79 the gate's first run
#   reported ~200 style findings, none of them defects. 100 is the
#   ceiling the reviewed tree actually observes once its two prose
#   outliers are rewrapped, so new lines keep a hard limit while the
#   gate stays defect-oriented.
#
#   ignore — E402 is the deliberate sys.path-before-import pattern the
#   suite harness and the runner need to import checked-in modules
#   (run_tests.py, tests/test_pr_body_overflow.py); every other entry is
#   pycodestyle's own default ignore list, spelled out because `ignore =`
#   replaces the defaults rather than extending them.
[pycodestyle]
max-line-length = 100
ignore = E402,E121,E123,E126,E226,E24,E704,W503,W504
