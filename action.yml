name: Pull request admission gate
description: Validate rendered pull requests against base-commit policy and assigned issues.
author: Nitjsefnie
inputs:
  github-token:
    description: Token with contents read, issues read, and pull-requests write permissions.
    required: true
  repository:
    description: Consumer repository in owner/name form.
    required: true
  pull-request-number:
    description: Number of the pull request to check.
    required: true
  pull-request-author:
    description: Login of the pull request author.
    required: true
  require-commit-attribution:
    description: >-
      Enable the commit-attribution check. Only 'true' (case-insensitive;
      surrounding whitespace ignored) enables it.
    default: 'false'
  template-path:
    description: Consumer template path, read at the pull request base SHA.
    default: .github/PULL_REQUEST_TEMPLATE.md
runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.15.1'
    - name: Check pull request admission
      shell: bash
      env:
        PR_GATE_ACTOR: ${{ inputs.pull-request-author }}
        GH_TOKEN: ${{ inputs.github-token }}
        PR_GATE_PR: ${{ inputs.pull-request-number }}
        PR_GATE_ACTION_PATH: ${{ github.action_path }}
        PR_GATE_REPO: ${{ inputs.repository }}
        PR_GATE_REQUIRE_COMMIT_ATTRIBUTION: ${{ inputs.require-commit-attribution }}
        PR_GATE_TEMPLATE_PATH: ${{ inputs.template-path }}
      run: python "$PR_GATE_ACTION_PATH/scripts/ci/pr_gate.py"
