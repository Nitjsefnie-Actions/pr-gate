name: release dispatch

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (for example, 2.1.1)'
        required: true
        type: string

permissions: {}

concurrency:
  group: release-dispatch
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read
      checks: read
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
    steps:
      - name: Refuse a dispatch that is not on main
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo 'Release dispatch requires the main branch.' >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
      # Docs-only main tips whose suites were skipped or never registered
      # cannot be released: only successful required push checks count.
      - name: Validate the version and wait for required push checks
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          PR_GATE_REPOSITORY: ${{ github.repository }}
          PR_GATE_VERSION: ${{ inputs.version }}
        run: python scripts/ci/release_dispatch.py verify "$PR_GATE_REPOSITORY" "$PR_GATE_VERSION"

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Refuse a dispatch that is not on main
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo 'Release dispatch requires the main branch.' >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
      - name: Create the annotated tag and release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          PR_GATE_REPOSITORY: ${{ github.repository }}
          PR_GATE_VERSION: ${{ inputs.version }}
          PR_GATE_RELEASE_SHA: ${{ needs.verify.outputs.sha }}
        run: python scripts/ci/release_dispatch.py publish "$PR_GATE_REPOSITORY" "$PR_GATE_VERSION" "$PR_GATE_RELEASE_SHA"
