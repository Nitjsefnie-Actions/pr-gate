name: tests

# Paths, subprocesses and Unicode cross OS boundaries, so every supported
# Python version runs the same real parser/controller/action suites on each OS.
on:
  push:
    branches: [main]
    # Deny only human documentation; new code and policy paths still run tests.
    paths-ignore: [README.md, CONTRIBUTING.md, CODE_OF_CONDUCT.md, LICENSE]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  suites:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tests never push; keep credentials out of the checkout.
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install development-only tools
        run: python -m pip install -r requirements-test.txt
      - name: Run every suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python run_tests.py
      - name: Lint Python
        run: python -m ruff check --select E9,F63,F7,F82 .
