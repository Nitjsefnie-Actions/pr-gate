name: tests

# Paths, subprocesses and Unicode cross OS boundaries, so every supported
# Python version runs the same real parser/controller/action suites on each OS.
on:
  push:
    # Default branch only: a pull-request head already gets one run from
    # the `pull_request` event below, and an unfiltered `push` schedules
    # the same commit a second time under a different ref, which the
    # `concurrency` group cannot collapse.
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        uses: Nitjsefnie-Actions/test-ratchet/plan@caf72ff77921794d9573c8b8aabe008946dcca45 # v2.5.0
        with:
          tests: tests/**/test_*.py
          times: .github/test-times.json
          shards: 2

  test:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.14", "3.15"]
        shard: ${{ fromJSON(needs.plan.outputs.matrix).shard }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tests never push; keep credentials out of the checkout.
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install development-only tools
        run: python -m pip install -r requirements-test.txt
      - uses: Nitjsefnie-Actions/test-ratchet/run@caf72ff77921794d9573c8b8aabe008946dcca45 # v2.5.0
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        with:
          runner: pytest
          tests: tests/**/test_*.py
          times: .github/test-times.json
          # The cell .github/ci-thresholds.json records.
          cell: ${{ matrix.os }} / Python ${{ matrix.python }}
          shard: ${{ matrix.shard }}
          source: scripts/ci
      - name: Lint Python
        run: python -m ruff check --select E9,F63,F7,F82 .

  report:
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ github.event_name == 'push' && github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch && format('{0}-push', github.event.repository.default_branch) || '' }}
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: Nitjsefnie-Actions/test-ratchet/report@caf72ff77921794d9573c8b8aabe008946dcca45 # v2.5.0
        with:
          github-token: ${{ github.token }}
          thresholds: .github/ci-thresholds.json
          cell: ubuntu-latest / Python 3.15
          times: .github/test-times.json
          push-key: ${{ secrets.MASTER_PUSH_DEPLOY_KEY }}
