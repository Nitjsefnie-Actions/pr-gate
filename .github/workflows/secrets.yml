name: secrets

# Gitleaks sweeps the full tree and the full git history on every run,
# catching the credentials GitHub's push protection does not: push
# protection covers provider-recognised patterns only, so an ad-hoc
# token, a session cookie, or a private URL with embedded credentials
# reaches main unremarked.
#
# THE PULL REQUEST RUN IS A REQUIRED MERGE CHECK. The pull_request
# trigger below is load-bearing: the `main requires green checks`
# ruleset (id 22556551) requires this job's `gitleaks` context on main,
# so a pull request that introduces a secret this scan detects cannot
# merge. Renaming the job or dropping the pull_request trigger makes
# every future merge strand loudly on a missing required check — by
# design; restore the job, do not edit the ruleset around it.
#
# THE CRON IS STILL THE GATE FOR COMMITS NO WORKFLOW SAW. A push carrying
# [skip ci], or a commit that landed before this workflow existed, never
# started a run; the daily schedule re-answers for the whole history, so
# such a commit is scanned the next morning rather than never.
#
# THE BINARY IS FROZEN BY HAND. v8.30.1 is pinned and digest-verified, so
# no run scans with a silently changed scanner. Every bump rescans the
# whole history under the new rules, which is the price of the bump.

on:
  push:
    # main only. A branch pushed while its pull request is open would run
    # this a second time against the same SHA.
    branches: [main]
  pull_request:
  schedule:
    # Off the hour, and clear of this repository's other scheduled slots:
    # codeql Wed 03:47 and scorecard Sat 02:23.
    - cron: '26 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the scan reads `git log -p`, so a shallow clone
          # would scan a suffix of history and call the rest clean.
          fetch-depth: 0
          # Nothing here pushes; the job token must not survive the checkout.
          persist-credentials: false

      - name: Download gitleaks and verify its digest
        # One attempt per answer is not enough: a reset connection exits
        # nonzero exactly like a finding would, so the download retries.
        run: |
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 60 \
            --retry 8 --retry-all-errors --retry-max-time 300 \
            --output gitleaks_8.30.1_linux_x64.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz' | sha256sum -c -
          tar xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          ./gitleaks version

      - name: Take the scan's config and ignore list from the trusted commit
        # Read from the judged tree, they would let a change exempt its own
        # finding: the base commit on a pull request, the previous tip on a
        # push, main's tip for a scheduled or dispatched scan.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          case "$EVENT_NAME" in
            pull_request) trusted="$BASE_SHA" ;;
            push) trusted="$BEFORE_SHA" ;;
            *) trusted="$(git rev-parse --verify --quiet refs/remotes/origin/main)" || trusted= ;;
          esac
          # An empty name would read the index, the judged tree.
          read_trusted() {
            case "$trusted" in '' | *[!0-9a-f]*) return 1 ;; esac
            git cat-file blob "$trusted:$1"
          }
          dir="$RUNNER_TEMP/gitleaks-trusted"
          mkdir "$dir"
          if ! read_trusted .gitleaks.toml > "$dir/.gitleaks.toml"; then
            echo "no .gitleaks.toml at trusted commit '$trusted': default rules"
            printf '[extend]\nuseDefault = true\n' > "$dir/.gitleaks.toml"
          fi
          if ! read_trusted .gitleaksignore > "$dir/.gitleaksignore"; then
            echo "no .gitleaksignore at trusted commit '$trusted': nothing ignored"
          fi
          python3 -I - "$dir/.gitleaks.toml" <<'PY'
          import sys
          import tomllib

          def keys(table, prefix=""):
              for key, value in table.items():
                  name = prefix + key.lower()
                  yield name, value
                  if isinstance(value, dict):
                      yield from keys(value, name + ".")

          with open(sys.argv[1], "rb") as config:
              if any(n == "extend.path" and v != "" for n, v in keys(tomllib.load(config))):
                  sys.exit("trusted .gitleaks.toml sets [extend] path, which gitleaks "
                           "resolves inside the judged checkout: refusing to scan")
          PY

      - name: Scan the tree and the history
        # Bare on purpose: this step's exit status IS the gate, so no
        # condition, fallback or error-swallowing suffix belongs here.
        # The log is public: --verbose names findings, --redact masks them.
        # --ignore-gitleaks-allow stops an inline `gitleaks:allow` comment in
        # the scanned change from suppressing its own finding; the config and
        # ignore list come from the trusted commit, never the judged tree.
        run: |
          rm -rf .gitleaksignore
          echo '* !diff' > .git/info/attributes
          ./gitleaks detect --verbose --redact --ignore-gitleaks-allow \
            --config "$RUNNER_TEMP/gitleaks-trusted/.gitleaks.toml" \
            --gitleaks-ignore-path "$RUNNER_TEMP/gitleaks-trusted"
