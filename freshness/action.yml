name: Gate-base freshness
description: Fail a pull request whose head lacks a default-branch commit touching a file a required check reads.
author: Nitjsefnie
inputs:
  github-token:
    description: Token that reads the default branch's rules.
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - name: Require this head to carry main's gate-defining commits
      shell: bash
      env:
        PR_GATE_ACTION_PATH: ${{ github.action_path }}
        GH_TOKEN: ${{ inputs.github-token }}
        PR_GATE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        PR_GATE_REQUIRED_CHECKS=$(gh api "repos/$GITHUB_REPOSITORY/rules/branches/${PR_GATE_DEFAULT_BRANCH:-main}" --jq '.[] | select(.type == "required_status_checks") | .parameters.required_status_checks[].context')
        export PR_GATE_REQUIRED_CHECKS
        python3 "$PR_GATE_ACTION_PATH/../scripts/ci/gate_base_freshness.py" --root "$GITHUB_WORKSPACE"
